<!DOCTYPE html>
<html lang="ja" data-direction="up">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#8b1e3f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>智頭急行 時刻表</title>
    <link rel="manifest" href="manifest.json?v=2026">
    <link rel="apple-touch-icon" href="icon-192.png">
    <style>
        :root {
            --direction-color:#8b1e3f;
            --paper:#faf9f6;
            --major:#e6f1e7;
            --hakuto:#eef7ff;
            --inaba:#fffbea;
            --grid:#d8dde3;
            --station-width:76px;
            --event-width:24px;
            --train-width:48px;
        }
        :root[data-direction="down"] { --direction-color:#1f4e79; }
        :root[lang="en"] { --station-width:104px; --event-width:30px; }
        * { box-sizing:border-box; margin:0; padding:0; }
        html { height:100%; background:var(--direction-color); }
        body {
            height:100vh; height:100dvh; overflow:hidden;
            display:flex; flex-direction:column;
            background:var(--direction-color); color:#334155;
            padding-top:env(safe-area-inset-top);
            padding-left:env(safe-area-inset-left);
            padding-right:env(safe-area-inset-right);
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
            font-size:12px;
        }
        header {
            display:flex; align-items:center; justify-content:space-between; gap:6px;
            min-height:44px; padding:0 8px; color:white; flex-shrink:0;
        }
        .brand { min-width:0; font-size:14px; font-weight:700; line-height:1.15; }
        #app-version { display:block; font-size:9px; font-weight:400; opacity:.8; }
        .language-switch { display:flex; flex-shrink:0; align-items:center; }
        .lang-btn {
            border:0; background:transparent; color:#e4dfe2;
            width:40px; height:44px; font-size:12px; cursor:pointer;
        }
        .lang-btn[aria-pressed="true"] { color:white; font-weight:800; text-decoration:underline; text-underline-offset:5px; }
        .language-switch span { opacity:.5; }
        .controls { display:flex; gap:5px; padding:0 5px 5px; flex-shrink:0; }
        .btn {
            flex:1; height:46px; padding:0 4px; border:2px solid transparent; border-radius:5px;
            background:#41464d; color:#aeb4bb; font-size:15px; font-weight:400; cursor:pointer;
        }
        .btn.active {
            background:var(--direction-color); color:white; border-color:#ffffffc9;
            font-size:26px; font-weight:800; box-shadow:inset 0 -2px white;
        }
        .direction-caption { display:block; font-size:9px; line-height:12px; font-weight:400; }
        :root[lang="en"] .btn { font-size:12px; }
        :root[lang="en"] .btn.active { font-size:16px; }
        .chizu-section > .station-cell { box-shadow:inset 2px 0 var(--direction-color); padding-left:5px; }
        button:focus-visible, .table-container:focus-visible { outline:3px solid #eebd47; outline-offset:-3px; }
        .table-container { flex:1; min-height:0; overflow:auto; background:var(--paper); -webkit-overflow-scrolling:touch; }
        table { table-layout:fixed; border-collapse:separate; border-spacing:0; }
        th, td {
            height:24px; padding:1px 2px; white-space:nowrap; text-align:center;
            border-right:1px solid var(--grid); border-bottom:1px solid var(--grid);
        }
        .station-cell {
            position:sticky; left:0; z-index:5; width:var(--station-width);
            background:var(--paper); text-align:left; font-size:11px; font-weight:700;
            border-right:1px solid #94a3b8;
        }
        .event-cell {
            position:sticky; left:var(--station-width); z-index:5; width:var(--event-width);
            background:var(--paper); font-size:10px; color:#64748b; border-right:2px solid #94a3b8;
        }
        .train-cell { width:var(--train-width); }
        thead th { position:sticky; top:0; z-index:10; height:36px; font-size:11px; line-height:1.15; border-bottom:2px solid #94a3b8; }
        thead .station-cell, thead .event-cell { z-index:15; }
        .col-default { background:var(--paper); }
        .col-hakuto { background:var(--hakuto); }
        .col-inaba { background:var(--inaba); }
        .number-note { flex-shrink:0; padding:3px 6px 1px; background:var(--paper); color:#64748b; font-size:10px; line-height:14px; }
        thead th { border-top:4px solid var(--paper); height:40px; }
        .time-cell.pass-mark { font-size:12px; font-weight:400; }
        .time-cell { font-size:17px; line-height:20px; font-weight:600; font-variant-numeric:tabular-nums; }
        .major-station > .station-cell, .major-station > .event-cell,
        .major-station > .col-default { background:var(--major); }
        .arrival-row > * { border-bottom:0; }
        .departure-row > * { border-top:1px dashed #91a397; }
        .station-start > * { border-top:1px solid #94a99a; }
        .jr-boundary > * { border-top:3px double var(--direction-color); }
        :root[lang="en"] .station-cell { white-space:normal; overflow-wrap:normal; font-size:11px; line-height:11px; }
        footer { flex-shrink:0; height:calc(5px + env(safe-area-inset-bottom)); background:var(--direction-color); }
    </style>
</head>
<body>
    <header>
        <div class="brand"><span id="app-title">智頭急行 時刻表</span><span id="app-version"></span></div>
        <div class="language-switch" role="group" aria-label="表示言語 / Language">
            <button class="lang-btn" id="lang-ja" type="button" lang="ja" aria-label="日本語" aria-pressed="true" onclick="switchLanguage('ja')">JP</button>
            <span aria-hidden="true">/</span>
            <button class="lang-btn" id="lang-en" type="button" lang="en" aria-label="English" aria-pressed="false" onclick="switchLanguage('en')">EN</button>
        </div>
    </header>
    <div class="controls" role="group" id="direction-controls" aria-label="方向">
        <button id="btn-up" class="btn active" type="button" aria-pressed="true" onclick="switchDirection('up')">のぼり</button>
        <button id="btn-down" class="btn" type="button" aria-pressed="false" onclick="switchDirection('down')">くだり</button>
    </div>
    <div class="number-note" id="number-note">列車番号：智頭線内</div>
    <div class="table-container" id="table-scroll" role="region" aria-label="時刻表" tabindex="0">
        <table id="timetable-table" aria-label="智頭急行 時刻表">
            <thead id="table-head"></thead>
            <tbody id="table-body"></tbody>
        </table>
    </div>
    <footer aria-hidden="true"></footer>
    <script src="timetable.js"></script>
    <script>
        const APP_VERSION = "0.4.3";
        const STATION_EN = {
            "倉吉":"Kurayoshi", "鳥取":"Tottori", "郡家":"Koge", "智頭":"Chizu",
            "恋山形":"Koi-Yamagata", "山郷":"Yamasato", "あわくら温泉":"Awakura-Onsen",
            "西粟倉":"Nishi-Awakura", "大原":"Ohara", "宮本武蔵":"Miyamoto-Musashi",
            "石井":"Ishii", "平福":"Hirafuku", "佐用":"Sayo", "久崎":"Kuzaki",
            "河野原円心":"Konohara-Enshin", "苔縄":"Kokenawa", "上郡":"Kamigori",
            "岡山":"Okayama", "姫路":"Himeji", "明石":"Akashi", "三ノ宮":"Sannomiya",
            "大阪":"Osaka", "新大阪":"Shin-Osaka", "京都":"Kyoto"
        };
        const LABELS = {
            ja:{title:"智頭急行 時刻表", up:"のぼり", down:"くだり", station:"駅名", arr:"着", dep:"発", direction:"方向", table:"時刻表"},
            en:{title:"Chizu Express Timetable", up:"Chizu → Kamigori", down:"Kamigori → Chizu", station:"Station", arr:"Arr.", dep:"Dep.", direction:"Direction", table:"Timetable"}
        };
        let currentDirection = "up";
        let currentLanguage = "ja";
        try { if (localStorage.getItem("timetable-language") === "en") currentLanguage = "en"; } catch {}

        window.addEventListener("DOMContentLoaded", () => {
            document.getElementById("app-version").textContent = "Ver." + APP_VERSION;
            switchLanguage(currentLanguage);
        });
        if ("serviceWorker" in navigator && location.protocol !== "file:") {
            window.addEventListener("load", () => {
                navigator.serviceWorker.register("sw.js?v=2026").catch(console.error);
            });
        }
        function switchDirection(dir) {
            if (!["up", "down"].includes(dir)) return;
            currentDirection = dir;
            document.documentElement.dataset.direction = dir;
            document.querySelector('meta[name="theme-color"]').content = dir === "up" ? "#8b1e3f" : "#1f4e79";
            for (const direction of ["up", "down"]) {
                const button = document.getElementById("btn-" + direction);
                button.classList.toggle("active", direction === dir);
                button.setAttribute("aria-pressed", String(direction === dir));
            }
            renderTimetable();
        }
        function switchLanguage(lang) {
            if (!["ja", "en"].includes(lang)) return;
            const scroll = document.getElementById("table-scroll");
            const {scrollTop, scrollLeft} = scroll;
            currentLanguage = lang;
            document.documentElement.lang = lang;
            try { localStorage.setItem("timetable-language", lang); } catch {}
            const labels = LABELS[lang];
            document.title = labels.title;
            document.getElementById("number-note").textContent = lang === "en" ? "Train numbers: Chizu Line section" : "列車番号：智頭線内";
            document.getElementById("app-title").textContent = labels.title;
            document.getElementById("btn-up").textContent = labels.up;
            document.getElementById("btn-down").textContent = labels.down;
            if (lang === "en") {
                for (const dir of ["up", "down"]) {
                    const caption = document.createElement("span");
                    caption.className = "direction-caption";
                    caption.textContent = "Chizu Line";
                    document.getElementById("btn-" + dir).prepend(caption);
                }
            }
            document.getElementById("direction-controls").setAttribute("aria-label", labels.direction);
            scroll.setAttribute("aria-label", labels.table);
            for (const language of ["ja", "en"]) {
                document.getElementById("lang-" + language).setAttribute("aria-pressed", String(language === lang));
            }
            switchDirection(currentDirection);
            scroll.scrollTop = scrollTop;
            scroll.scrollLeft = scrollLeft;
        }
        function getTrainClass(train) {
            if (train.includes("はくと")) return "col-hakuto";
            if (train.includes("いなば")) return "col-inaba";
            return "col-default";
        }
        function renderTimetable() {
            const data = currentDirection === "up" ? timetable.nobori : timetable.kudari;
            const labels = LABELS[currentLanguage];
            const table = document.getElementById("timetable-table");
            // CSSの実寸を使い、固定駅名欄と列車欄のずれを防ぐ。
            const style = getComputedStyle(document.documentElement);
            const fixedWidth = parseFloat(style.getPropertyValue("--station-width")) + parseFloat(style.getPropertyValue("--event-width"));
            const trainWidth = parseFloat(style.getPropertyValue("--train-width"));
            table.style.width = (fixedWidth + data.trains.length * trainWidth) + "px";
            table.setAttribute("aria-label", labels.title + " · " + labels[currentDirection]);
            const head = document.getElementById("table-head");
            const body = document.getElementById("table-body");
            head.replaceChildren(); body.replaceChildren();
            const header = document.createElement("tr");
            const stationHeader = document.createElement("th");
            stationHeader.className = "station-cell"; stationHeader.scope = "col";
            stationHeader.textContent = labels.station; header.appendChild(stationHeader);
            const eventHeader = document.createElement("th");
            eventHeader.className = "event-cell"; eventHeader.scope = "col";
            eventHeader.setAttribute("aria-label", labels.arr + " / " + labels.dep); header.appendChild(eventHeader);
            for (const train of data.trains) {
                const cell = document.createElement("th");
                cell.scope = "col"; cell.className = "train-cell " + getTrainClass(train);
                const match = train.match(/^(?:スーパー)?(はくと|いなば)(.*)$/);
                if (match) {
                    const name = currentLanguage === "en" ? (match[1] === "はくと" ? "Hakuto" : "Inaba") : match[1];
                    const number = currentLanguage === "en" ? match[2].replace("号", "") : match[2];
                    cell.append(name, document.createElement("br"), number);
                    cell.setAttribute("aria-label", currentLanguage === "en" ? "Super " + name + " " + number : train);
                } else cell.textContent = train;
                header.appendChild(cell);
            }
            head.appendChild(header);
            const entryStation = currentDirection === "up" ? "智頭" : "上郡";
            const exitStation = currentDirection === "up" ? "上郡" : "智頭";
            const sectionStart = data.rows.findIndex(row => row.station.trim().split(/\s+/).join(" ") === entryStation + " 発");
            const sectionEnd = data.rows.findIndex(row => row.station.trim().split(/\s+/).join(" ") === exitStation + " 着");
            data.rows.forEach((row, i) => {
                const [station, event = ""] = row.station.trim().split(/\s+/);
                const previous = data.rows[i - 1]?.station.trim().split(/\s+/)[0];
                const next = data.rows[i + 1]?.station.trim().split(/\s+/)[0];
                const tr = document.createElement("tr");
                if (["智頭", "大原", "佐用", "上郡"].includes(station) && i >= sectionStart && i <= sectionEnd) {
                    tr.classList.add("major-station");
                    if (previous !== station) tr.classList.add("station-start");
                }
                if (event === "着" && next === station) tr.classList.add("arrival-row");
                if (event === "発" && previous === station) {
                    tr.classList.add("departure-row");
                    if (["智頭", "上郡"].includes(station)) tr.classList.add("jr-boundary");
                }
                const name = document.createElement("th");
                name.scope = "row"; name.className = "station-cell";
                name.textContent = currentLanguage === "en" ? (STATION_EN[station] || station) : station;
                if (sectionStart >= 0 && sectionEnd >= sectionStart && i >= sectionStart && i <= sectionEnd) {
                    tr.classList.add("chizu-section");
                }
                tr.appendChild(name);
                const eventCell = document.createElement("td");
                eventCell.className = "event-cell";
                eventCell.textContent = event === "着" ? labels.arr : event === "発" ? labels.dep : event;
                tr.appendChild(eventCell);
                row.times.forEach((time, index) => {
                    const cell = document.createElement("td");
                    cell.className = "time-cell train-cell " + getTrainClass(data.trains[index] || "");
                    const isLimitedExpress = getTrainClass(data.trains[index] || "") !== "col-default";
                    if (time === "↓" && isLimitedExpress) {
                        cell.textContent = "レ";
                        cell.classList.add("pass-mark");
                        cell.setAttribute("aria-label", currentLanguage === "en" ? "Passes without stopping" : "通過");
                    } else cell.textContent = time;
                    tr.appendChild(cell);
                });
                body.appendChild(tr);
            });
        }
    </script>
</body>
</html>
