<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>智頭急行 時刻表 PWA</title>

    <link rel="manifest" href="manifest.json?v=2026">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style"
          content="black-translucent">

    <link rel="apple-touch-icon" href="icon-192.png">

    <style>

:root{
    /* 初期はのぼり色 */
    --header-bg:#8b1e3f;
    --header-text:#ffffff;

    /* 紙のような白 */
    --station-bg:#f8f8f8;
    --border-color:#d8dde3;

    /* 列車種別 */
    --bg-default:#f8f8f8;   /* 普通 */
    --bg-local:#f4faf3;     /* 主要駅（あとで使用） */
    --bg-hakuto:#eef7ff;    /* スーパーはくと */
    --bg-inaba:#fffbea;     /* スーパーいなば */
}

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-user-select:none;
    user-select:none;
    -webkit-touch-callout:none;
}

body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,
                "Helvetica Neue",Arial,sans-serif;
    background:#f8f8f8;
    color:#334155;
    font-size:12px;
    height:100vh;
    overflow:hidden;
    display:flex;
    flex-direction:column;
}

header{
    background:var(--header-bg);
    color:var(--header-text);
    padding:8px 12px;
    text-align:center;
    font-size:14px;
    font-weight:bold;
    flex-shrink:0;
}

.controls{
    display:flex;
    gap:6px;
    padding:6px;
    background:#f8e9ed;
    flex-shrink:0;
}

.btn{
    flex:1;
    padding:12px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:14px;
    font-weight:bold;
    background:#fff;
    color:#475569;
    opacity:.6;
}

#btn-up.active{
    background:#f8d8df;
    color:#8b1e3f;
    opacity:1;
    font-size:16px;
}

#btn-down.active{
    background:#dfefff;
    color:#1f4e79;
    opacity:1;
    font-size:16px;
}

.table-container{
    flex:1;
    overflow:auto;
    -webkit-overflow-scrolling:touch;
}

table{
    border-collapse:separate;
    border-spacing:0;
    width:max-content;
    min-width:100%;
}

th,
td{
    border-right:1px solid var(--border-color);
    border-bottom:1px solid var(--border-color);
    padding:6px 8px;
    text-align:center;
    white-space:nowrap;
}

.thead-sticky th{
    position:sticky;
    background:#f8f8f8;
    z-index:10;
}

.row-h0 th{
    top:0;
    z-index:12;
}

table th:nth-child(1),
table td:nth-child(1){
    position:sticky;
    left:0;
    background:var(--station-bg);
    font-weight:bold;
    text-align:left;
    border-right:2px solid #94a3b8;
    z-index:5;
}

table th:nth-child(2),
table td:nth-child(2){
    position:sticky;
    left:70px;
    background:var(--station-bg);
    border-right:2px solid #94a3b8;
    color:#64748b;
    font-size:10px;
    z-index:5;
}

.thead-sticky th:nth-child(1),
.thead-sticky th:nth-child(2){
    background:#f8f8f8;
    z-index:15;
}

.col-hakuto{
    background:var(--bg-hakuto)!important;
}

.col-inaba{
    background:var(--bg-inaba)!important;
}

.col-local{
    background:var(--bg-local)!important;
}

.col-default{
    background:var(--bg-default);
}

.time-cell{
    font-variant-numeric:tabular-nums;
    font-weight:500;
}

.empty-cell{
    color:#cbd5e1;
}

    </style>
</head>

<body>

<header>智頭急行 時刻表</header>

<div class="controls">
    <button id="btn-up"
            class="btn active"
            onclick="switchDirection('up')">
        のぼり
    </button>

    <button id="btn-down"
            class="btn"
            onclick="switchDirection('down')">
        くだり
    </button>
</div>

<div class="table-container">

    <table id="timetable-table">

        <thead id="table-head"
               class="thead-sticky">
        </thead>

        <tbody id="table-body">
        </tbody>

    </table>

</div>

<script src="timetable.js"></script>

<script>
    let currentDirection = "up";

if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
        navigator.serviceWorker.register("sw.js?v=2026");
    });
}

window.addEventListener("DOMContentLoaded", () => {
    switchDirection("up");
});

function switchDirection(dir){

    currentDirection = dir;

    document
        .getElementById("btn-up")
        .classList.toggle("active", dir === "up");

    document
        .getElementById("btn-down")
        .classList.toggle("active", dir === "down");

    // 画面テーマ切替
    if(dir === "up"){

        document.documentElement.style.setProperty("--header-bg", "#8b1e3f");
        document.querySelector(".controls").style.background = "#f8e9ed";

    }else{

        document.documentElement.style.setProperty("--header-bg", "#1f4e79");
        document.querySelector(".controls").style.background = "#eaf4fc";

    }

    renderTimetable();

}

function toHalfWidth(str){

    if(!str) return "";

    return str.replace(/[Ａ-Ｚａ-ｚ０-９]/g,function(s){
        return String.fromCharCode(s.charCodeAt(0)-0xFEE0);
    });

}

function getTrainClass(train){

    const t = toHalfWidth(train);

    if(t.includes("はくと")) return "col-hakuto";

    if(t.includes("いなば")) return "col-inaba";

    if(t.includes("D")) return "col-local";

    return "col-default";

}

function renderTimetable(){

    const data =
        currentDirection==="up"
        ? timetable.nobori
        : timetable.kudari;

    const thead=document.getElementById("table-head");
    const tbody=document.getElementById("table-body");

    thead.innerHTML="";
    tbody.innerHTML="";

    createHeader(data,thead);

    createBody(data,tbody);

}

function createHeader(data,thead){

    const tr=document.createElement("tr");

    tr.className="row-h0";

    let th=document.createElement("th");
    th.textContent="駅名";
    tr.appendChild(th);

    th=document.createElement("th");
    th.textContent="";
    tr.appendChild(th);

    data.trains.forEach(train=>{

        const h=document.createElement("th");

        h.textContent=train;

        h.className=getTrainClass(train);

        tr.appendChild(h);

    });

    thead.appendChild(tr);

}
function createBody(data, tbody){

    data.rows.forEach(row => {

        const tr = document.createElement("tr");

        const parts = row.station.split(" ");

        let td = document.createElement("td");
        td.textContent = parts[0] || "";
        tr.appendChild(td);

        td = document.createElement("td");
        td.textContent = parts.slice(1).join(" ");
        tr.appendChild(td);

        row.times.forEach((time, index) => {

            const td = document.createElement("td");

            td.textContent = time;

            td.className =
                "time-cell " +
                getTrainClass(data.trains[index]);

            if(time === ""){
                td.classList.add("empty-cell");
            }

            tr.appendChild(td);

        });

        tbody.appendChild(tr);

    });

}
</script>

</body>
</html>
